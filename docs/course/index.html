<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}html{color-scheme:light dark}</style>
<title>PCCP Precursor Chemicals Course</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>

/* Layout: continuous-scroll lessons (Rise style). Navy band + sticky progress bar on top, white canvas, contents rail on wide screens, drawer on phones. */
:root{
  --bg:#FFFFFF; --ink:#12263F; --muted:#4A5F78; --blue:#0B5CAD; --navy:#0A2A52; --onnavy:#FFFFFF;
  --tint:#EEF5FC; --line:#D0DFEF; --btn:#0B5CAD; --onbtn:#FFFFFF;
  --ok:#17693F; --okbg:#E6F5EC; --warn:#85500A; --warnbg:#FFF3DC; --bad:#A8231B; --badbg:#FDEBEA;
  --font:Verdana,Geneva,"DejaVu Sans",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1828; --ink:#E7EFF9; --muted:#A3B6CC; --blue:#6DB1F5; --navy:#0A2A52; --onnavy:#FFFFFF;
  --tint:#13263E; --line:#27425F; --btn:#6DB1F5; --onbtn:#07203F;
  --ok:#6AD09B; --okbg:#10301F; --warn:#F0B14F; --warnbg:#35280F; --bad:#F59A93; --badbg:#3A1815; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1828; --ink:#E7EFF9; --muted:#A3B6CC; --blue:#6DB1F5; --navy:#0A2A52; --onnavy:#FFFFFF;
  --tint:#13263E; --line:#27425F; --btn:#6DB1F5; --onbtn:#07203F;
  --ok:#6AD09B; --okbg:#10301F; --warn:#F0B14F; --warnbg:#35280F; --bad:#F59A93; --badbg:#3A1815; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--font);line-height:1.25;text-wrap:balance;margin:0}
p{margin:0 0 14px}
a{color:var(--blue)}
button{font-family:var(--font);font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* banner + progress bar */
.banner{background:var(--navy);color:var(--onnavy);border-bottom:4px solid #2B86D1}
.banner .wrap{display:flex;gap:16px;align-items:center;justify-content:space-between;padding-block:18px;flex-wrap:wrap}
.mark{font-weight:700;letter-spacing:.02em;font-size:15px;line-height:1.3}
.mark small{display:block;font-weight:400;letter-spacing:.14em;text-transform:uppercase;font-size:10px;opacity:.8;margin-bottom:3px}
.banner .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--navy);color:var(--onnavy)}
.bar .wrap{display:flex;align-items:center;gap:14px;padding-block:9px}
.bar button.menu{background:transparent;border:1px solid rgba(255,255,255,.45);color:var(--onnavy);border-radius:5px;padding:6px 10px;cursor:pointer;font-size:12px}
.track{flex:1;height:8px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden;min-width:60px}
.track i{display:block;height:100%;width:0;background:#7CC0F7;transition:width .4s}
.pct{font-size:12px;white-space:nowrap}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:40px;padding-block:8px 60px}
.toc{display:none}
.toc.open{display:block;position:fixed;z-index:25;top:calc(env(safe-area-inset-top,0px) + 50px);left:0;right:0;bottom:0;overflow:auto;background:var(--bg);padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.toc h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.toc button.t{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:9px 10px;cursor:pointer;line-height:1.35;font-size:13px}
.toc button.t:hover{background:var(--tint)}
.toc button.t.cur{background:var(--tint);font-weight:700;color:var(--blue)}
.toc .n{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted)}
.toc .done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.toc .done .n::before{content:"\2713"}
.toc .done .n span{display:none}
@media (min-width:960px){
  .layout{grid-template-columns:250px minmax(0,1fr)}
  .toc{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);align-self:start;max-height:calc(100vh - 80px);overflow:auto;padding-top:36px}
  .bar button.menu{display:none}
}

/* lessons */
main{min-width:0}
.hero{padding-block:40px 28px}
.hero h1{font-size:clamp(1.55rem,4.6vw,2.2rem);color:var(--navy);margin-bottom:14px}
:root[data-theme="dark"] .hero h1{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero h1{color:var(--ink)}}
.lede{font-size:16px;max-width:60ch;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0;padding:0;list-style:none}
.meta li{background:var(--tint);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:12px}
section.lesson{padding-block:40px;border-top:1px solid var(--line);scroll-margin-top:60px}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:700;margin-bottom:8px}
section.lesson>h2{font-size:clamp(1.3rem,3.6vw,1.65rem);margin-bottom:16px}
h3{font-size:16px;margin:26px 0 10px}
.prose{max-width:62ch}
ul.plain{padding-left:20px;margin:0 0 14px}
ul.plain li{margin-bottom:6px}
.callout{background:var(--tint);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin:20px 0;max-width:68ch}
.callout.warn{background:var(--warnbg);border-color:var(--warn)}
.callout .lab{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:6px;color:var(--blue)}
.callout.warn .lab{color:var(--warn)}
.callout p:last-child{margin-bottom:0}
.btn{background:var(--btn);color:var(--onbtn);border:0;border-radius:6px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:13px}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn:disabled{opacity:.5;cursor:default}
.foot{margin-top:34px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.foot .ok{color:var(--ok);font-weight:700;font-size:13px}

/* flip cards */
.flipgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:20px 0}
.flip{background:none;border:0;padding:0;text-align:left;cursor:pointer;perspective:900px;min-width:0}
.flip-in{display:grid;transition:transform .5s;transform-style:preserve-3d}
.flip[aria-pressed="true"] .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px;padding:18px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-height:170px}
.front{background:var(--navy);color:var(--onnavy)}
.front strong{font-size:16px}
.front em{margin-top:auto;font-size:11px;font-style:normal;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.back{background:var(--tint);transform:rotateY(180deg);font-size:13px;line-height:1.55}
@media (prefers-reduced-motion:reduce){.flip-in{transition:none}.track i{transition:none}}

/* tabs */
.tabs{margin:20px 0;max-width:760px}
.tablist{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--line)}
.tablist button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 14px;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.tablist button[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
.tabs .panel{padding:18px 2px 4px}
.tabs .panel[hidden]{display:none}

/* accordion */
details.acc{border:1px solid var(--line);border-radius:6px;margin-bottom:8px;max-width:760px;background:var(--bg)}
details.acc summary{cursor:pointer;padding:13px 16px;font-weight:700;font-size:14px;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";color:var(--blue);font-size:18px;line-height:1}
details.acc[open] summary::after{content:"\2212"}
details.acc[open]{background:var(--tint)}
details.acc .in{padding:0 16px 14px}

/* timeline */
.tl{list-style:none;margin:20px 0;padding:0;max-width:700px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 18px 22px}
.tl li::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:2px solid var(--bg)}
.tl time{display:block;font-weight:700;font-size:13px;color:var(--blue)}

/* chain steps */
.chain{margin:20px 0;max-width:820px}
.steps{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0 0 14px;list-style:none}
.steps button{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 12px;cursor:pointer;font-size:12.5px;font-weight:700;text-align:left}
.steps button b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--tint);color:var(--blue);font-size:11px;flex:none}
.steps button[aria-current="true"]{background:var(--btn);color:var(--onbtn);border-color:var(--btn)}
.steps button[aria-current="true"] b{background:var(--onbtn);color:var(--btn)}
.stepdetail{background:var(--tint);border:1px solid var(--line);border-radius:6px;padding:18px}
.stepdetail h4{font-size:15px;margin-bottom:8px}
.stepdetail ul{margin:8px 0 0;padding-left:20px}

/* explorer */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0 8px;max-width:820px}
.tools label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.tools input,.tools select{width:100%;font-family:var(--font);font-size:14px;padding:9px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.count{font-size:12px;color:var(--muted);margin:6px 0 12px}
.chems{display:grid;gap:10px;max-width:820px}
.chem{border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.chem .top{display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.chem h4{font-size:14px;overflow-wrap:anywhere}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:2px 9px;background:var(--tint);border:1px solid var(--line);color:var(--blue);white-space:nowrap}
.pill.d{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.chem .row{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.chem .row b{color:var(--ink)}
.chem .ids{font-variant-numeric:tabular-nums}

/* quiz */
.quiz{margin:26px 0;max-width:720px}
.quiz .qh{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--blue);margin-bottom:8px}
fieldset.q{border:1px solid var(--line);border-radius:6px;padding:16px 18px 14px;margin:0 0 12px;min-width:0}
fieldset.q legend{font-weight:700;padding:0 6px;max-width:100%}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--tint)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:10px;font-size:13px;padding:10px 12px;border-radius:6px;background:var(--tint)}
.fb.good{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.fb span{color:var(--ink)}

/* scenarios */
.scn{border:1px solid var(--line);border-radius:8px;margin:22px 0;max-width:760px;overflow:hidden}
.scn header{background:var(--navy);color:var(--onnavy);padding:12px 18px}
.scn header small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.scn header strong{font-size:15px}
.scn .body{padding:18px}
.scn .sit{background:var(--tint);border-radius:6px;padding:12px 14px;margin-bottom:14px;font-size:13.5px}
.scn .q{font-weight:700;margin-bottom:8px}

/* flag cards */
.flags{display:grid;gap:10px;margin:18px 0;max-width:760px}
.fc{border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.fc p{margin:0 0 10px;font-size:13.5px}
.fc .btns{display:flex;gap:8px;flex-wrap:wrap}
.fc .btns button{border:1.5px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:12.5px}
.fc .btns button:disabled{cursor:default}
.fc .btns button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.fc .btns button.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.score{font-weight:700;margin-top:6px}

/* certificate */
.cert{border:2px solid var(--navy);border-radius:8px;padding:28px 22px;margin:22px 0;max-width:620px;text-align:center;background:var(--tint)}
.cert small{display:block;letter-spacing:.14em;text-transform:uppercase;font-size:10.5px;color:var(--muted)}
.cert h3{font-size:20px;margin:10px 0}
.cert .nm{font-size:22px;font-weight:700;color:var(--blue);margin:10px 0;min-height:30px;overflow-wrap:anywhere}
.namefield{max-width:360px;margin:14px 0}
.namefield label{display:block;font-size:12px;margin-bottom:4px;color:var(--muted)}
.namefield input{width:100%;font-family:var(--font);font-size:14px;padding:9px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.src{font-size:12px;color:var(--muted);max-width:68ch}
.src li{margin-bottom:6px}

/* registration + results */
body.gated .layout{grid-template-columns:minmax(0,1fr)}
body.gated .toc{display:none!important}
body.gated .bar button.menu{display:none}
.reg{border:1px solid var(--line);border-radius:8px;padding:20px;margin:6px 0 8px;max-width:760px;background:var(--tint)}
.reg h2{font-size:17px;margin-bottom:8px}
.reg .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0 8px}
.reg label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.reg input{width:100%;font-family:var(--font);font-size:14px;padding:10px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.reg .sub,.adm .sub{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.reg .acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.err{color:var(--bad);font-size:12.5px;margin:6px 0}
.adm{margin:22px 0;max-width:900px;border:1px solid var(--line);border-radius:8px;padding:18px}
.adm h2{font-size:17px;margin-bottom:4px}
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.met{background:var(--tint);border-radius:6px;padding:12px}
.met b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.met span{font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto;margin-top:12px}
table.res{border-collapse:collapse;width:100%;min-width:640px;font-size:12.5px}
table.res th,table.res td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.res th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
table.res td.num{font-variant-numeric:tabular-nums}
.pill.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}

:root{--logoband:#FFFFFF}
.banner{background:var(--logoband);color:#12263F;border-bottom:4px solid #2B86D1}
.banner .wrap{padding-block:14px;justify-content:center}
.logo{display:block;margin:0 auto;width:min(420px,100%);height:auto}


.langsw{display:flex;gap:0;border:1px solid rgba(255,255,255,.45);border-radius:5px;overflow:hidden}
.langsw button{background:transparent;border:0;color:var(--onnavy);padding:6px 12px;cursor:pointer;font-size:12px;font-weight:700}
.langsw button[aria-pressed="true"]{background:#fff;color:#0A2A52}
.bar .wrap .spacer{flex:0}
.vid video{width:100%;max-width:860px;display:block;border-radius:8px;background:#000;aspect-ratio:16/9}
.vid .sub{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;max-width:860px}
.chap{display:flex;gap:10px;align-items:baseline;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 12px;cursor:pointer;font-size:12.5px;min-width:0}
.chap:hover{border-color:var(--blue);background:var(--tint)}
.chap b{color:var(--blue);font-variant-numeric:tabular-nums;flex:none}
.cert .clogo{display:block;margin:0 auto 12px;max-width:200px;height:auto;border-radius:4px;background:#fff;padding:4px}
.finres{margin-top:14px;max-width:720px}
.tabs .panel .scroll{margin-top:8px}
.tabs{max-width:900px}
.tablist button{font-size:12.5px;padding:9px 11px}

var QUIZ={
 q1:{items:[
  {q:["A company orders 20 tonnes of toluene, a Table II solvent. What is the best reading?","Une entreprise commande 20 tonnes de toluène, un solvant du Tableau II. Quelle est la meilleure lecture ?"],o:[["Proof of diversion, so seize it","Preuve de détournement : il faut saisir"],["Not suspicious on its own, because solvents trade in huge legitimate volumes; judge the whole context","Pas suspect en soi, car les solvants s'échangent en énormes volumes légitimes ; jugez l'ensemble du contexte"],["Table II chemicals never need checks","Les produits du Tableau II n'exigent jamais de contrôle"],["Only Table I chemicals can be misused","Seuls les produits du Tableau I peuvent être détournés"]],a:1,w:["Most solvents and acids have large legitimate markets. Documents, parties, routing and end use say more than volume.","La plupart des solvants et acides ont de grands marchés légitimes. Les documents, les parties, l'itinéraire et l'utilisation finale en disent plus que le volume."]},
  {q:["Which term describes a chemical made to avoid controls, with no known legitimate use?","Quel terme désigne un produit chimique conçu pour échapper aux contrôles, sans usage légitime connu ?"],o:[["Reagent","Réactif"],["Designer precursor","Précurseur de synthèse"],["Excipient","Excipient"],["Essential solvent","Solvant essentiel"]],a:1,w:["Designer precursors are created to sidestep scheduling. The INCB flags several of them in Table I.","Les précurseurs de synthèse sont créés pour contourner le classement. L'OICS en signale plusieurs dans le Tableau I."]}
 ]},
 q2:{items:[
  {q:["Who decides whether a substance is added to Table I or Table II?","Qui décide d'ajouter une substance au Tableau I ou au Tableau II ?"],o:[["The WCO Council","Le Conseil de l'OMD"],["The Commission on Narcotic Drugs","La Commission des stupéfiants"],["Customs at each port","La douane de chaque port"],["Interpol","Interpol"]],a:1,w:["The INCB assesses substances, and the Commission on Narcotic Drugs decides on scheduling.","L'OICS évalue les substances et la Commission des stupéfiants décide du classement."]},
  {q:["A consignment is declared as pseudoephedrine hydrochloride. Is it covered by Table I?","Un envoi est déclaré comme chlorhydrate de pseudoéphédrine. Est-il couvert par le Tableau I ?"],o:[["No, only the base form is listed","Non, seule la forme base est listée"],["Yes, salts are covered whenever such salts can exist","Oui, les sels sont couverts lorsqu'ils peuvent exister"],["Only above one kilogram","Seulement au-dessus d'un kilogramme"],["Only when exported","Seulement à l'exportation"]],a:1,w:["Both tables cover salts. The exception is salts of hydrochloric and sulphuric acid in Table II.","Les deux tableaux couvrent les sels. L'exception : les sels de l'acide chlorhydrique et de l'acide sulfurique dans le Tableau II."]}
 ]},

  {q:["Which chemical does the video describe as one of the most closely watched in the world?","Quel produit chimique la vidéo décrit-elle comme l'un des plus surveillés au monde ?"],o:[["Toluene","Toluène"],["Acetic anhydride","Anhydride acétique"],["Piperonal","Pipéronal"],["Anthranilic acid","Acide anthranilique"]],a:1,w:["Acetic anhydride turns morphine into heroin and is closely monitored worldwide.","L'anhydride acétique transforme la morphine en héroïne et il est surveillé de près dans le monde entier."]}
 ]},

  {q:["Potassium permanganate, a Table I chemical, is linked to which drug?","Le permanganate de potassium, produit du Tableau I, est lié à quelle drogue ?"],o:[["Cocaine","Cocaïne"],["LSD","LSD"],["PCP","PCP"],["Methaqualone","Méthaqualone"]],a:0,w:["It has water-treatment uses and is used to purify cocaine.","Il sert au traitement de l'eau et à purifier la cocaïne."]},
  {q:["Ergometrine and ergotamine are medicines. Which drug are they linked to?","L'ergométrine et l'ergotamine sont des médicaments. À quelle drogue sont-elles liées ?"],o:[["Fentanyl","Fentanyl"],["MDMA","MDMA"],["LSD","LSD"],["Heroin","Héroïne"]],a:2,w:["Both belong to the ergot family and lead to LSD. Quantities are tiny, so documents and end users matter.","Toutes deux appartiennent à la famille de l'ergot et mènent au LSD. Les quantités sont infimes : documents et destinataires finaux comptent."]}

 q3:{items:[
  {q:["Which of these is listed in Table II?","Lequel de ces produits figure au Tableau II ?"],o:[["Acetic anhydride","Anhydride acétique"],["Piperidine","Pipéridine"],["Safrole","Safrole"],["4-AP","4-AP"]],a:1,w:["Piperidine is one of the eight Table II chemicals. The other three are in Table I.","La pipéridine est l'un des huit produits du Tableau II. Les trois autres sont au Tableau I."]},
  {q:["Which pair was added to Table I on 3 December 2024?","Quelle paire a été ajoutée au Tableau I le 3 décembre 2024 ?"],o:[["APAAN and APAA","APAAN et APAA"],["4-piperidone and 1-boc-4-piperidone","4-pipéridone et 1-boc-4-pipéridone"],["Norfentanyl and 4-AP","Norfentanyl et 4-AP"],["MAPA and ANPP","MAPA et ANPP"]],a:1,w:["4-piperidone and 1-boc-4-piperidone joined in December 2024. Norfentanyl and 4-AP came in 2022.","La 4-pipéridone et la 1-boc-4-pipéridone ont été ajoutées en décembre 2024. Le norfentanyl et la 4-AP datent de 2022."]}
 ]},
 q4:{items:[
  {q:["A chemical is in neither Table I nor Table II. What does that mean?","Un produit chimique ne figure ni au Tableau I ni au Tableau II. Qu'est-ce que cela signifie ?"],o:[["No monitoring is possible","Aucune surveillance n'est possible"],["It may still be nationally controlled or monitored, for example on the INCB special surveillance list","Il peut tout de même être contrôlé ou surveillé au niveau national, par exemple sur la liste de surveillance spéciale de l'OICS"],["It can be exported anywhere freely","Il peut être exporté librement partout"],["It cannot be a precursor","Il ne peut pas être un précurseur"]],a:1,w:["Non-scheduled does not mean harmless. Countries add their own controls and the INCB tracks non-scheduled chemicals.","Non classé ne veut pas dire inoffensif. Les pays ajoutent leurs propres contrôles et l'OICS suit les produits non classés."]},
  {q:["What is PEN Online Light?","Qu'est-ce que PEN Online Light ?"],o:[["A mandatory system for Table I","Un système obligatoire pour le Tableau I"],["Voluntary exchange of notifications on non-scheduled chemicals","Un échange volontaire de notifications sur les produits non classés"],["A public seizure database","Une base de données publique des saisies"],["A customs declaration portal","Un portail de déclaration en douane"]],a:1,w:["It extends the notification idea to chemicals outside the Convention, on a voluntary basis.","Il étend l'idée de notification aux produits hors Convention, sur une base volontaire."]}
 ]},
 q5:{items:[
  {q:["Who can use PEN Online?","Qui peut utiliser PEN Online ?"],o:[["Any exporter","Tout exportateur"],["Competent national authorities only","Les autorités nationales compétentes uniquement"],["Any customs broker","Tout commissionnaire en douane"],["The general public","Le grand public"]],a:1,w:["Access is limited to competent national authorities. Officers go through their national authority.","L'accès est limité aux autorités nationales compétentes. Les agents passent par leur autorité nationale."]},
  {q:["What does a pre-export notification do?","À quoi sert une notification préalable à l'exportation ?"],o:[["Pays the export duty","Elle paie les droits d'exportation"],["Tells the importing country about a planned export so it can verify and respond before shipment","Elle informe le pays importateur d'une exportation prévue afin qu'il vérifie et réponde avant l'expédition"],["Replaces the export licence","Elle remplace la licence d'exportation"],["Classifies the chemical","Elle classe le produit chimique"]],a:1,w:["It gives the importing authority a chance to check the buyer and the need before goods move.","Elle donne à l'autorité importatrice la possibilité de vérifier l'acheteur et le besoin avant le départ des marchandises."]}
 ]},
 q8:{items:[
  {q:["You find a leaking, unlabelled drum in a container. What first?","Vous trouvez un fût qui fuit, sans étiquette, dans un conteneur. Que faites-vous en premier ?"],o:[["Open it to identify the contents","L'ouvrir pour identifier le contenu"],["Smell it to guess the chemical","Le sentir pour deviner le produit"],["Keep clear, isolate the area and call trained hazmat support under your procedure","Vous éloigner, isoler la zone et appeler un soutien formé aux matières dangereuses selon votre procédure"],["Pour it into another container","Le verser dans un autre récipient"]],a:2,w:["Unknown chemicals can be toxic, corrosive or flammable. Secure the area and let trained staff handle it.","Les produits inconnus peuvent être toxiques, corrosifs ou inflammables. Sécurisez la zone et laissez le personnel formé intervenir."]}
 ]}

 [["Payment comes in cash from a third country with no link to buyer or seller.","Le paiement arrive en espèces d'un pays tiers sans lien avec l'acheteur ni le vendeur."],"flag",["Unexplained third-party payment hides who is really buying.","Un paiement inexpliqué par un tiers masque qui achète réellement."]],
 [["Sulphuric acid for a fertiliser plant arrives with a licence and end-use declaration on file, and the buyer asks for fast clearance.","De l'acide sulfurique destiné à une usine d'engrais arrive avec une licence et une déclaration d'utilisation finale au dossier, et l'acheteur demande un dédouanement rapide."],"routine",["A request for speed alone is not an indicator when everything else checks out.","Une demande de rapidité seule n'est pas un indicateur lorsque tout le reste est en ordre."]],
 [["The route passes three transit countries with no commercial reason, and the final destination changed after departure.","L'itinéraire traverse trois pays de transit sans raison commerciale, et la destination finale a changé après le départ."],"flag",["Circuitous routing and mid-transit changes are classic diversion signs.","Les itinéraires détournés et les changements en cours de route sont des signes classiques de détournement."]],
 [["Several small parcels of the same intermediate go to different residential addresses in one town within a week.","Plusieurs petits colis du même intermédiaire vont à différentes adresses résidentielles d'une même ville en une semaine."],"flag",["This looks like splitting. Link the parcels and assess them together.","Cela ressemble à du fractionnement. Reliez les colis et évaluez-les ensemble."]]
];

var SCN={
 s1:{title:["The solvent container","Le conteneur de solvant"],intro:["A 40-foot container arrives declared as 'industrial cleaning solvent', 20 drums. The consignee is a company registered a month ago. There is no chemicals licence on file. The CAS number printed on the drum label does not match the declared product.","Un conteneur de 40 pieds arrive, déclaré comme « solvant de nettoyage industriel », 20 fûts. Le destinataire est une société enregistrée il y a un mois. Aucune licence pour produits chimiques n'est au dossier. Le numéro CAS imprimé sur l'étiquette des fûts ne correspond pas au produit déclaré."],
  steps:[
   {q:["What is your first action?","Quelle est votre première action ?"],o:[
     [["Release the container on the strength of the invoice","Libérer le conteneur sur la foi de la facture"],0,["The documents are already inconsistent. Releasing now leaves no way to correct it.","Les documents sont déjà incohérents. Libérer maintenant ne laisse aucun moyen de corriger."]],
     [["Hold the consignment, verify the licence with the competent authority and run the label and CAS check","Retenir l'envoi, vérifier la licence auprès de l'autorité compétente et contrôler l'étiquette et le numéro CAS"],1,["Correct. Holding and verifying keeps every option open and follows the chain of control.","Correct. Retenir et vérifier laisse toutes les options ouvertes et suit la chaîne de contrôle."]],
     [["Open a drum and smell it to identify the liquid","Ouvrir un fût et le sentir pour identifier le liquide"],0,["Unsafe and unreliable. Unknown chemicals can be toxic or corrosive. Sampling belongs to trained staff.","Dangereux et peu fiable. Les produits inconnus peuvent être toxiques ou corrosifs. Le prélèvement revient au personnel formé."]],
     [["Phone the shipper and ask for an explanation","Appeler l'expéditeur et demander une explication"],0,["This can alert the network and lead to destruction of evidence. Escalate internally first.","Cela peut alerter le réseau et entraîner la destruction de preuves. Remontez d'abord en interne."]]]},
   {q:["The competent authority confirms that no valid licence exists for this consignee. What next?","L'autorité compétente confirme qu'aucune licence valide n'existe pour ce destinataire. Et ensuite ?"],o:[
     [["Return the container to the shipper","Renvoyer le conteneur à l'expéditeur"],0,["Sending it back moves the problem elsewhere and may destroy leads.","Le renvoyer déplace le problème ailleurs et peut détruire des pistes."]],
     [["Detain under national chemical control law, brief investigators, preserve evidence and let them consider options such as a controlled delivery","Retenir en vertu de la loi nationale sur le contrôle des produits chimiques, informer les enquêteurs, préserver les preuves et les laisser étudier des options comme une livraison surveillée"],1,["Correct. Use your legal powers, document everything and involve investigators and the competent authority.","Correct. Utilisez vos pouvoirs légaux, documentez tout et associez enquêteurs et autorité compétente."]],
     [["Let the consignee collect it and follow them","Laisser le destinataire le récupérer et le suivre"],0,["A controlled delivery needs legal authorisation and a plan. It cannot be improvised at the gate.","Une livraison surveillée exige une autorisation légale et un plan. Elle ne s'improvise pas à la barrière."]]]}
  ],end:["You held the goods, verified, and escalated through the right channel without alerting the network.","Vous avez retenu les marchandises, vérifié et remonté par la bonne voie sans alerter le réseau."]},
 s2:{title:["The express parcels","Les colis express"],intro:["Over one week, nine small parcels arrive by express courier, each declared 'pharmaceutical intermediate' at about 5 kg and low value. They come from different shippers in different countries and go to nine residential addresses in the same town.","En une semaine, neuf petits colis arrivent par courrier express, chacun déclaré « intermédiaire pharmaceutique », environ 5 kg, de faible valeur. Ils viennent d'expéditeurs différents dans différents pays et vont à neuf adresses résidentielles de la même ville."],
  steps:[
   {q:["What does this pattern suggest?","Que suggère ce schéma ?"],o:[
     [["Ordinary e-commerce, so clear each parcel on its own","Du commerce en ligne ordinaire : dédouaner chaque colis séparément"],0,["Judging each parcel separately misses the pattern. The shared product, town and timing connect them.","Juger chaque colis séparément fait manquer le schéma. Le produit, la ville et le calendrier communs les relient."]],
     [["Possible splitting to stay below thresholds, so link the parcels and assess them together","Un possible fractionnement pour rester sous les seuils : relier les colis et les évaluer ensemble"],1,["Correct. Splitting is a known way to avoid attention on a single large shipment.","Correct. Le fractionnement est un moyen connu d'éviter l'attention sur un seul gros envoi."]],
     [["A tariff classification error","Une erreur de classement tarifaire"],0,["The pattern across shippers and addresses is not explained by a coding mistake.","Le schéma à travers expéditeurs et adresses ne s'explique pas par une erreur de codage."]]]},
   {q:["What is the best next move?","Quelle est la meilleure suite ?"],o:[
     [["Target the parcels for inspection by trained staff, record the addresses and shippers, and share the pattern with the competent authority and intelligence unit","Cibler les colis pour une inspection par du personnel formé, relever adresses et expéditeurs, et partager le schéma avec l'autorité compétente et le service de renseignement"],1,["Correct. Inspection plus intelligence sharing helps map the network behind the parcels.","Correct. L'inspection et le partage du renseignement aident à cartographier le réseau derrière les colis."]],
     [["Destroy the parcels at once","Détruire les colis immédiatement"],0,["Destroying them loses evidence and the chance to identify the buyers.","Les détruire fait perdre des preuves et la chance d'identifier les acheteurs."]],
     [["Ignore them because each is under a kilogram threshold you assume exists","Les ignorer car chacun est sous un seuil d'un kilogramme que vous supposez exister"],0,["The Convention sets no minimum quantity, and splitting is designed to exploit assumed thresholds.","La Convention ne fixe aucune quantité minimale, et le fractionnement vise à exploiter des seuils supposés."]]]}
  ],end:["You treated the parcels as one pattern and passed the intelligence on.","Vous avez traité les colis comme un seul schéma et transmis le renseignement."]}
};

var LESSONS=[
 {id:"l1",min:4,title:["Why precursors matter","Pourquoi les précurseurs comptent"],blocks:[
  {k:"p",t:[["A precursor chemical is a substance used to make illicit drugs. Most of them also have large legitimate uses: medicines, fragrances, cleaning products, paints, fertiliser, water treatment. The same drum can serve a pharmacy plant or a clandestine laboratory.","Un produit précurseur est une substance utilisée pour fabriquer des drogues illicites. La plupart ont aussi de larges usages légitimes : médicaments, parfums, produits de nettoyage, peintures, engrais, traitement de l'eau. Le même fût peut servir une usine pharmaceutique ou un laboratoire clandestin."],["That is why borders matter. A drug that has not been made yet cannot be sold. Stopping the chemical on the way in or out cuts production at its source.","C'est pourquoi les frontières comptent. Une drogue qui n'a pas encore été fabriquée ne peut pas être vendue. Arrêter le produit chimique à l'entrée ou à la sortie coupe la production à la source."]]},
  {k:"h",t:["Four terms you will hear","Quatre termes que vous entendrez"]},
  {k:"flips"},
  {k:"co",warn:1,lab:["Keep in mind","À retenir"],ps:[["Volume alone rarely tells you much. Large legitimate trades in solvents and acids are normal. Look at the whole picture: who, what, how much, how paid, how routed.","Le volume seul en dit rarement beaucoup. De grands échanges légitimes de solvants et d'acides sont normaux. Regardez l'ensemble : qui, quoi, combien, comment payé, quel itinéraire."]]},
  {k:"quiz",id:"q1"}
 ]},
 {id:"l2",min:5,title:["The legal framework","Le cadre juridique"],blocks:[
  {k:"p",t:[["Article 12 of the 1988 UN Convention against Illicit Traffic in Narcotic Drugs and Psychotropic Substances sets the rules for precursor control. It lists substances in two tables and obliges States to monitor, license and record their trade.","L'article 12 de la Convention des Nations Unies de 1988 contre le trafic illicite de stupéfiants et de substances psychotropes fixe les règles du contrôle des précurseurs. Il liste des substances dans deux tableaux et oblige les États à surveiller, autoriser et enregistrer leur commerce."],["The International Narcotics Control Board (INCB) monitors how States apply the rules and assesses substances. The Commission on Narcotic Drugs (CND) decides on adding a substance to a table. The INCB publishes the Red List, the current list of controlled precursors.","L'Organe international de contrôle des stupéfiants (OICS) surveille la manière dont les États appliquent les règles et évalue les substances. La Commission des stupéfiants (CND) décide d'ajouter une substance à un tableau. L'OICS publie la Liste rouge, la liste actuelle des précurseurs contrôlés."]]},
  {k:"tabs",items:[
   {t:["Table I","Tableau I"],p:[["Table I holds the substances most directly tied to drug manufacture. It carries the strictest obligations, including pre-export notification to the importing country. The Red List (23rd edition, July 2025) lists 43 entries in Table I, counting each ester separately. They include ephedrine, pseudoephedrine, safrole, acetic anhydride, potassium permanganate and a growing group of fentanyl-related chemicals.","Le Tableau I contient les substances les plus directement liées à la fabrication de drogues. Il porte les obligations les plus strictes, dont la notification préalable au pays importateur. La Liste rouge (23e édition, juillet 2025) compte 43 entrées au Tableau I, en comptant chaque ester séparément. Elles comprennent l'éphédrine, la pseudoéphédrine, le safrole, l'anhydride acétique, le permanganate de potassium et un groupe croissant de produits liés au fentanyl."]]},
   {t:["Table II","Tableau II"],p:[["Table II holds eight widely used industrial chemicals that are also needed in drug processing: acetone, anthranilic acid, ethyl ether, hydrochloric acid, methyl ethyl ketone, piperidine, sulphuric acid and toluene. Trade is huge, so controls rely on monitoring and good intelligence rather than blocking trade.","Le Tableau II contient huit produits industriels très utilisés, aussi nécessaires à la transformation des drogues : acétone, acide anthranilique, éther éthylique, acide chlorhydrique, méthyléthylcétone, pipéridine, acide sulfurique et toluène. Le commerce est énorme : les contrôles reposent donc sur la surveillance et le renseignement plutôt que sur le blocage du commerce."]]},
   {t:["Salts and limits","Sels et limites"],p:[["Both tables cover the salts of listed substances whenever such salts can exist. Pseudoephedrine hydrochloride is therefore controlled just as pseudoephedrine is. The one exception: salts of hydrochloric acid and sulphuric acid are excluded from Table II.","Les deux tableaux couvrent les sels des substances listées chaque fois que de tels sels peuvent exister. Le chlorhydrate de pseudoéphédrine est donc contrôlé tout comme la pseudoéphédrine. Seule exception : les sels de l'acide chlorhydrique et de l'acide sulfurique sont exclus du Tableau II."],["The Convention sets no minimum quantity. National law may add thresholds, exemptions for certain preparations, or extra chemicals.","La Convention ne fixe aucune quantité minimale. Le droit national peut ajouter des seuils, des exemptions pour certaines préparations, ou des produits supplémentaires."]]}
  ]},
  {k:"h",t:["Recent additions to Table I","Ajouts récents au Tableau I"]},
  {k:"tl",items:[
   [["19 November 2019","19 novembre 2019"],["3,4-MDP-2-P methyl glycidic acid and its methyl ester; APAA","Acide méthylglycidique du 3,4-MDP-2-P et son ester méthylique ; APAA"]],
   [["3 November 2020","3 novembre 2020"],["MAPA (methyl alpha-phenylacetoacetate)","MAPA (alpha-phénylacétoacétate de méthyle)"]],
   [["23 November 2022","23 novembre 2022"],["4-AP, 1-boc-4-AP and norfentanyl, all linked to fentanyl-type opioids","4-AP, 1-boc-4-AP et norfentanyl, tous liés aux opioïdes de type fentanyl"]],
   [["3 December 2024","3 décembre 2024"],["1-boc-4-piperidone and 4-piperidone; seven further esters of 3,4-MDP-2-P methyl glycidic acid; P-2-P methyl glycidic acid and eight of its esters","1-boc-4-pipéridone et 4-pipéridone ; sept autres esters de l'acide méthylglycidique du 3,4-MDP-2-P ; acide P-2-P méthylglycidique et huit de ses esters"]]
  ]},
  {k:"quiz",id:"q2"}
 ]},
 {id:"l3",min:8,title:["Video: every chemical in Table I and II","Vidéo : chaque produit des Tableaux I et II"],blocks:[
  {k:"p",t:[["The video walks through every substance in Table I and Table II: what it is used for and which drug it can lead to. It is built for law enforcement and customs training. Captions are in the picture. Use the chapter buttons to jump to a drug.","La vidéo passe en revue chaque substance des Tableaux I et II : à quoi elle sert et à quelle drogue elle peut mener. Elle est conçue pour la formation des services de police et de douane. Les sous-titres sont dans l'image. Utilisez les boutons de chapitre pour aller à une drogue."]]},
  {k:"video"},
  {k:"co",lab:["Level of detail","Niveau de détail"],ps:[["The video is at recognition level. It helps you know what to look for and why. It does not describe how to make any drug.","La vidéo est au niveau de la reconnaissance. Elle aide à savoir quoi chercher et pourquoi. Elle ne décrit pas comment fabriquer une drogue."]]},
  {k:"quiz",id:"qv"}
 ]},
 {id:"l4",min:8,title:["Drug by drug","Drogue par drogue"],blocks:[
  {k:"p",t:[["The same chemicals, grouped by the drug they can lead to. Select a drug to see the chemicals, what each is legitimately used for, and its role. The Red List itself does not map chemicals to drugs, so treat these links as general guidance and check the UNODC and INCB references for each substance.","Les mêmes produits, regroupés par drogue à laquelle ils peuvent mener. Choisissez une drogue pour voir les produits, leur usage légitime et leur rôle. La Liste rouge elle-même n'associe pas les produits aux drogues : considérez ces liens comme indicatifs et consultez les références de l'ONUDC et de l'OICS pour chaque substance."]]},
  {k:"drugs"},
  {k:"quiz",id:"qd"}
 ]},
 {id:"l5",min:7,title:["Chemical explorer","Explorateur de produits chimiques"],blocks:[
  {k:"p",t:[["Every substance in both tables, with CAS number, UN transport number where one applies, the main illicit use and legitimate uses. Filter by table or by the drug it is linked to, or search by name or number.","Chaque substance des deux tableaux, avec le numéro CAS, le numéro de transport ONU lorsqu'il existe, le principal usage illicite et les usages légitimes. Filtrez par tableau ou par drogue liée, ou cherchez par nom ou numéro."]]},
  {k:"explorer"},
  {k:"co",lab:["How to read this","Comment lire ceci"],ps:[["Ester families are grouped into one row, so the 43 Table I entries of the Red List appear as 27 rows. A dash in the UN column means no dedicated number is confirmed here. Stereoisomers and salts carry different CAS numbers than the base, so a mismatch does not clear a consignment on its own. Always confirm against the current INCB Red List before acting on a result.","Les familles d'esters sont regroupées en une ligne : les 43 entrées du Tableau I de la Liste rouge apparaissent donc en 27 lignes. Un tiret dans la colonne ONU signifie qu'aucun numéro dédié n'est confirmé ici. Les stéréoisomères et les sels ont des numéros CAS différents de la base : une différence ne suffit donc pas à écarter un envoi. Confirmez toujours avec la Liste rouge actuelle de l'OICS avant d'agir."]]},
  {k:"quiz",id:"q3"}
 ]},
 {id:"l6",min:5,title:["Beyond the tables","Au-delà des tableaux"],blocks:[
  {k:"p",t:[["Traffickers adapt. When one chemical is controlled they move to a close relative that is not. Frontline officers need to know that a chemical outside Table I and II may still matter.","Les trafiquants s'adaptent. Quand un produit est contrôlé, ils passent à un proche parent qui ne l'est pas. Les agents en première ligne doivent savoir qu'un produit hors des Tableaux I et II peut quand même compter."]]},
  {k:"acc",items:[
   {open:1,t:["Non-scheduled chemicals","Produits non classés"],p:["The INCB keeps a Limited International Special Surveillance List of non-scheduled chemicals used in making synthetic drugs, cocaine and heroin. It comes with recommended actions for authorities and industry. Recent additions cover precursors of new psychoactive substances, cutting agents and excipients, and nitazene precursors.","L'OICS tient une Liste internationale restreinte de surveillance spéciale de produits non classés utilisés pour fabriquer des drogues de synthèse, la cocaïne et l'héroïne. Elle s'accompagne de mesures recommandées pour les autorités et l'industrie. Les ajouts récents couvrent des précurseurs de nouvelles substances psychoactives, des agents de coupage et excipients, et des précurseurs de nitazènes."]},
   {t:["Designer precursors","Précurseurs de synthèse"],p:["These are chemicals made to get around controls and with no known legitimate use. The INCB flags several in Table I, including APAAN, APAA, MAPA, the glycidic acid derivatives and 1-boc-4-AP. Their appearance in trade almost always warrants a closer look.","Ce sont des produits conçus pour contourner les contrôles, sans usage légitime connu. L'OICS en signale plusieurs au Tableau I, dont l'APAAN, l'APAA, le MAPA, les dérivés de l'acide glycidique et la 1-boc-4-AP. Leur apparition dans le commerce justifie presque toujours un examen plus attentif."]},
   {t:["Pre-precursors and chemical relatives","Pré-précurseurs et parents chimiques"],p:["A pre-precursor is easily converted into a scheduled chemical. The INCB publishes a list of chemical relatives of controlled precursors. A consignment of an unfamiliar chemical with a name or structure close to a listed one deserves a question to the competent authority.","Un pré-précurseur se transforme facilement en un produit classé. L'OICS publie une liste de parents chimiques des précurseurs contrôlés. Un envoi d'un produit inconnu dont le nom ou la structure est proche d'un produit listé mérite une question à l'autorité compétente."]},
   {t:["Mixtures, preparations and mislabelling","Mélanges, préparations et faux étiquetage"],p:["Precursors may travel inside medicines, products or mixtures, or under another name or description. National rules differ on which preparations are exempt. The label, the invoice and the goods should all tell the same story.","Les précurseurs peuvent voyager dans des médicaments, des produits ou des mélanges, ou sous un autre nom ou une autre description. Les règles nationales diffèrent sur les préparations exemptées. L'étiquette, la facture et les marchandises doivent raconter la même histoire."]},
   {t:["PEN Online Light","PEN Online Light"],p:["Launched in 2022, PEN Online Light lets authorities exchange notifications on a voluntary basis for chemicals not controlled under the 1988 Convention. About 80 countries and territories use it.","Lancé en 2022, PEN Online Light permet aux autorités d'échanger des notifications, sur une base volontaire, pour des produits non contrôlés par la Convention de 1988. Environ 80 pays et territoires l'utilisent."]}
  ]},
  {k:"quiz",id:"q4"}
 ]},
 {id:"l7",min:6,title:["Chain of control","Chaîne de contrôle"],blocks:[
  {k:"p",t:[["Legitimate trade passes through seven checkpoints. Select each step to see what is checked and what you can verify at the border.","Le commerce légitime passe par sept points de contrôle. Sélectionnez chaque étape pour voir ce qui est vérifié et ce que vous pouvez contrôler à la frontière."]]},
  {k:"chain"},
  {k:"co",lab:["PEN Online","PEN Online"],ps:[["The INCB runs PEN Online, a secure system for exchanging pre-export notifications. Only competent national authorities can use it, and users come from about 170 countries and territories. It monitored nearly 28,000 shipments in 2024. Customs officers reach it through their national competent authority, not directly.","L'OICS gère PEN Online, un système sécurisé d'échange de notifications préalables à l'exportation. Seules les autorités nationales compétentes peuvent l'utiliser ; les utilisateurs viennent d'environ 170 pays et territoires. Il a suivi près de 28 000 expéditions en 2024. Les agents des douanes y accèdent par leur autorité nationale compétente, pas directement."]]},
  {k:"quiz",id:"q5"}
 ]},
 {id:"l8",min:7,title:["Spotting red flags","Repérer les signaux d'alerte"],blocks:[
  {k:"p",t:[["No single indicator proves diversion. A cluster of indicators, or one that cannot be explained, is what turns a routine consignment into a targeted check.","Aucun indicateur isolé ne prouve un détournement. Un ensemble d'indicateurs, ou un indicateur inexplicable, transforme un envoi ordinaire en contrôle ciblé."]]},
  {k:"tabs",items:[
   {t:["Documents","Documents"],ul:[["Product description does not match the labels, CAS or UN number.","La description du produit ne correspond pas aux étiquettes, au numéro CAS ou ONU."],["Licence, permit or end-use certificate missing, expired or cannot be verified.","Licence, permis ou certificat d'utilisation finale manquant, périmé ou invérifiable."],["Tariff code does not fit the product named.","Le code tarifaire ne correspond pas au produit nommé."],["Altered, re-issued or inconsistent documents.","Documents modifiés, rééditiés ou incohérents."]]},
   {t:["Commercial","Commercial"],ul:[["Newly formed company, no visible premises or trading history.","Société récente, sans local visible ni historique commercial."],["Quantity far out of line with the size or business of the buyer.","Quantité très disproportionnée par rapport à la taille ou à l'activité de l'acheteur."],["Payment by a third party, in cash, or through an unrelated country.","Paiement par un tiers, en espèces, ou via un pays sans rapport."],["Buyer will not explain end use or shows no technical knowledge of the product.","L'acheteur n'explique pas l'utilisation finale ou ne montre aucune connaissance technique du produit."]]},
   {t:["Goods","Marchandises"],ul:[["Labels removed, covered, handwritten or in an unexpected language.","Étiquettes retirées, couvertes, manuscrites ou dans une langue inattendue."],["Chemicals hidden among unrelated cargo or in unmarked drums and bags.","Produits chimiques cachés parmi une cargaison sans rapport ou dans des fûts et sacs non marqués."],["Repackaged goods with a manufacturer name that is not known to make that product.","Marchandises reconditionnées avec un nom de fabricant qui n'est pas connu pour ce produit."],["Packaging unsuited to the declared product.","Emballage inadapté au produit déclaré."]]},
   {t:["Route and behaviour","Itinéraire et comportement"],ul:[["Circuitous routing with no commercial reason; destination changed in transit.","Itinéraire détourné sans raison commerciale ; destination changée en cours de route."],["Many small consignments to different addresses (splitting).","Nombreux petits envois vers différentes adresses (fractionnement)."],["Pressure for fast clearance or to skip inspection.","Pression pour un dédouanement rapide ou pour éviter l'inspection."],["Parties linked to earlier seizures or alerts.","Parties liées à des saisies ou alertes antérieures."]]}
  ]},
  {k:"co",lab:["Three-minute label check","Contrôle d'étiquette en trois minutes"],ul:[["Name and CAS number on the label against the invoice and declaration.","Nom et numéro CAS de l'étiquette comparés à la facture et à la déclaration."],["UN number and hazard class against the transport document.","Numéro ONU et classe de danger comparés au document de transport."],["Does the manufacturer on the sticker exist, and does it make this product?","Le fabricant de l'étiquette existe-t-il, et fabrique-t-il ce produit ?"],["Batch number, date, seals and packaging condition.","Numéro de lot, date, scellés et état de l'emballage."]]},
  {k:"h",t:["Flag or routine?","Signal d'alerte ou normal ?"]},
  {k:"p",t:[["Decide for each situation. Feedback appears after you choose.","Décidez pour chaque situation. Le retour apparaît après votre choix."]]},
  {k:"flags"}
 ]},
 {id:"l9",min:6,title:["Scenarios","Scénarios"],blocks:[
  {k:"p",t:[["Two situations, one decision at a time. Wrong choices explain themselves and you can try again.","Deux situations, une décision à la fois. Les mauvais choix s'expliquent d'eux-mêmes et vous pouvez réessayer."]]},
  {k:"scn",id:"s1"},{k:"scn",id:"s2"}
 ]},
 {id:"l10",min:4,title:["Safety and reporting","Sécurité et signalement"],blocks:[
  {k:"co",warn:1,lab:["Safety first","La sécurité d'abord"],ps:[["Many precursors are corrosive, flammable, toxic or strong oxidisers. Never smell, taste or open unknown containers, and never mix substances. Only trained personnel with the right equipment should sample or handle them.","Beaucoup de précurseurs sont corrosifs, inflammables, toxiques ou fortement oxydants. Ne sentez, ne goûtez et n'ouvrez jamais des conteneurs inconnus, et ne mélangez jamais des substances. Seul du personnel formé, avec le bon équipement, doit les échantillonner ou les manipuler."]]},
  {k:"h",t:["If you suspect a diversion","Si vous soupçonnez un détournement"]},
  {k:"acc",items:[
   {open:1,t:["Stop and secure","Arrêtez et sécurisez"],p:["Keep the consignment where it is. Keep people clear if there is a leak, spill or odour. Follow your national hazardous materials procedure.","Gardez l'envoi où il est. Éloignez les personnes en cas de fuite, de déversement ou d'odeur. Suivez votre procédure nationale pour les matières dangereuses."]},
   {t:["Record what you see","Consignez ce que vous voyez"],p:["Photograph labels, seals, documents and packaging in place. Note container and seal numbers, parties, times and who handled what. This keeps the chain of custody intact.","Photographiez les étiquettes, scellés, documents et emballages sur place. Notez les numéros de conteneur et de scellé, les parties, les heures et qui a manipulé quoi. Cela préserve la chaîne de conservation."]},
   {t:["Escalate through the right channel","Remontez par le bon canal"],p:["Inform your supervisor and your national competent authority for precursor control. Customs intelligence and investigators decide on seizure, detention or a controlled delivery under national law. Do not warn the consignee or shipper.","Informez votre supérieur et votre autorité nationale compétente en matière de contrôle des précurseurs. Le renseignement douanier et les enquêteurs décident de la saisie, de la rétention ou d'une livraison surveillée selon le droit national. N'avertissez pas le destinataire ni l'expéditeur."]},
   {t:["International cooperation","Coopération internationale"],p:["Competent authorities exchange information through the INCB and PEN Online. Customs administrations also use WCO networks such as CENcomm and regional intelligence liaison offices. The INCB runs operational projects on synthetic drug precursors and opioid precursors that support real-time exchange between countries.","Les autorités compétentes échangent des informations via l'OICS et PEN Online. Les administrations douanières utilisent aussi les réseaux de l'OMD comme CENcomm et les bureaux régionaux de liaison pour le renseignement. L'OICS mène des projets opérationnels sur les précurseurs de drogues de synthèse et d'opioïdes qui soutiennent l'échange en temps réel entre pays."]}
  ]},
  {k:"quiz",id:"q8"}
 ]},
 {id:"l11",min:6,title:["Final assessment","Évaluation finale"],blocks:[
  {k:"p",t:[["Ten questions. You need 7 correct to pass.","Dix questions. Il faut 7 bonnes réponses pour réussir."]]},
  {k:"final"},
  {k:"sources"}
 ]}

(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};

function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
var KEY="pccp-precursor-course-bi-v1";

/* ---------- persistence ---------- */
function applyRecord(r){
  if(!r||typeof r!=="object")return;

  st.trainer=typeof r.trainer==="string"?r.trainer:"";st.name=typeof r.name==="string"?r.name:(st.first+" "+st.last).trim();
  st.done=Array.isArray(r.lessonsDone)?r.lessonsDone.filter(function(x){return typeof x==="string"}):[];
  st.attempts=typeof r.attempts==="number"?r.attempts:0;
  st.best=typeof r.best==="number"?r.best:null;
  st.lastScore=typeof r.lastScore==="number"?r.lastScore:null;
  st.completedAt=typeof r.completedAt==="string"?r.completedAt:null;
  st.startedAt=typeof r.startedAt==="string"?r.startedAt:null;

}
function loadLocal(){try{var raw=localStorage.getItem(KEY);if(raw)applyRecord(JSON.parse(raw))}catch(e){}}
function docBody(){return {first:st.first,last:st.last,trainer:st.trainer,name:st.name,lang:LANGS[LI],lessonsDone:st.done.slice(),lessonsCount:NL,attempts:st.attempts,best:st.best,lastScore:st.lastScore,total:TOTAL,passMark:PASS,passed:!!st.completedAt,startedAt:st.startedAt,completedAt:st.completedAt,updatedAt:new Date().toISOString()}}
function recText(){
  if(recState==="ok")return u("recOk");
  if(recState==="fail")return u("recFail");
  if(recState==="local")return u("recLocal");
  return "";
}
function setRec(v){recState=v;$$(".recnote").forEach(function(n){n.textContent=recText()})}
var wBusy=false,wDirty=false;
function pushRemote(){
  if(!st.name){return}
  if(!(db&&uid&&ref)){setRec("local");return}
  wDirty=true;if(wBusy)return;wBusy=true;
  (function run(){
    wDirty=false;
    ref.set(docBody()).then(function(){if(wDirty){run()}else{wBusy=false;setRec("ok")}},function(){wBusy=false;setRec("fail")});
  })();
}
function save(){

}
var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function shuf(n){var a=[],i,j,t;for(i=0;i<n;i++)a.push(i);for(i=n-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- content builders ---------- */
function paras(parent,list){list.forEach(function(p){parent.appendChild(el("p","",x(p)))})}

  if(b.ps)paras(c,b.ps);if(b.ul)ulist(c,b.ul);return c;
}
function flips(){

function tabs(items){

    var p=el("div","panel");p.setAttribute("role","tabpanel");p.hidden=i!==0;
    if(it.p)paras(p,it.p);if(it.ul)ulist(p,it.ul);

    btns.push(b);panels.push(p);list.appendChild(b);wrap.appendChild(p);
  });

}
function acc(items){
  var w=el("div");
  items.forEach(function(it){
    var d=el("details","acc");if(it.open)d.open=true;
    d.appendChild(el("summary","",x(it.t)));var i=el("div","in");i.appendChild(el("p","",x(it.p)));d.appendChild(i);w.appendChild(d);
  });
  return w;
}
function timeline(items){
  var ul=el("ul","tl");
  items.forEach(function(it){var li=el("li");li.appendChild(el("time","",x(it[0])));li.appendChild(el("span","",x(it[1])));ul.appendChild(li)});
  return ul;
}
function chain(){
  var w=el("div","chain"),steps=el("ol","steps"),detail=el("div","stepdetail");detail.setAttribute("aria-live","polite");
  var btns=[];
  function show(i){
    btns.forEach(function(b,j){if(j===i)b.setAttribute("aria-current","true");else b.removeAttribute("aria-current")});
    var s=CHAIN[i];detail.textContent="";
    detail.appendChild(el("h4","",x(s[0])));detail.appendChild(el("p","",x(s[1])));
    detail.appendChild(el("strong","",u("check")==="x"?"":(LI?"Que vérifier à la frontière :":"What to check at the border:")));
    var ul=el("ul");s[2].forEach(function(q){ul.appendChild(el("li","",x(q)))});detail.appendChild(ul);
  }
  CHAIN.forEach(function(s,i){
    var li=el("li"),b=el("button");b.type="button";b.appendChild(el("b","",String(i+1)));b.appendChild(el("span","",x(s[0])));
    b.addEventListener("click",function(){show(i)});btns.push(b);li.appendChild(b);steps.appendChild(li);
  });
  w.appendChild(steps);w.appendChild(detail);show(0);return w;
}
function quiz(id,heading){
  var data=QUIZ[id],box=el("div","quiz");
  box.appendChild(el("div","qh",heading||u("check")));
  data.items.forEach(function(it){
    var fs=el("fieldset","q");fs.appendChild(el("legend","",x(it.q)));
    var opts=el("div","opts"),fb=el("div","fb");fb.hidden=true;fb.setAttribute("aria-live","polite");
    var order=shuf(it.o.length),btns=[];
    order.forEach(function(oi){
      var b=el("button","opt",x(it.o[oi]));b.type="button";btns.push([b,oi]);
      b.addEventListener("click",function(){
        var ok=oi===it.a;
        btns.forEach(function(p){p[0].disabled=true;if(p[1]===it.a)p[0].classList.add("right")});
        if(!ok)b.classList.add("wrong");
        fb.hidden=false;fb.className="fb "+(ok?"good":"bad");fb.textContent="";
        fb.appendChild(el("b","",ok?u("right"):u("notq")));fb.appendChild(el("span","",x(it.w)));
      });
      opts.appendChild(b);
    });
    fs.appendChild(opts);fs.appendChild(fb);box.appendChild(fs);
  });
  return box;
}
function flags(){
  var g=el("div","flags"),sc=el("div","score"),n=0,right=0;
  FLAGS.forEach(function(f){
    var c=el("div","fc");c.appendChild(el("p","",x(f[0])));
    var bt=el("div","btns"),fb=el("div","fb");fb.hidden=true;
    var bf=el("button","",u("flagB")),br=el("button","",u("routineB"));bf.type=br.type="button";
    function pick(val,btn){
      var ok=val===f[1];bf.disabled=br.disabled=true;
      (f[1]==="flag"?bf:br).classList.add("right");if(!ok)btn.classList.add("wrong");
      fb.hidden=false;fb.className="fb "+(ok?"good":"bad");fb.textContent="";
      fb.appendChild(el("b","",ok?u("right"):u("notq")));fb.appendChild(el("span","",x(f[2])));
      n++;if(ok)right++;
      if(n===FLAGS.length)sc.textContent=u("youGot")+" "+right+" "+(LI?"sur":"of")+" "+FLAGS.length+".";
    }
    bf.addEventListener("click",function(){pick("flag",bf)});br.addEventListener("click",function(){pick("routine",br)});
    bt.appendChild(bf);bt.appendChild(br);c.appendChild(bt);c.appendChild(fb);g.appendChild(c);
  });
  g.appendChild(sc);return g;
}
function scenario(id,idx){
  var s=SCN[id],box=el("div","scn"),hd=el("header");
  hd.appendChild(el("small","",u("scn")+" "+idx));hd.appendChild(el("strong","",x(s.title)));box.appendChild(hd);
  var body=el("div","body");box.appendChild(body);
  var step=0;
  function render(){
    body.textContent="";
    var sit=el("div","sit",x(s.intro));body.appendChild(sit);
    if(step>=s.steps.length){
      var d=el("div","fb good");d.appendChild(el("b","",u("scnDone")));d.appendChild(el("span","",x(s.end)));body.appendChild(d);
      var r=el("button","btn ghost",u("replay"));r.type="button";r.style.marginTop="12px";r.addEventListener("click",function(){step=0;render()});body.appendChild(r);return;
    }
    var q=s.steps[step];body.appendChild(el("div","q",(step+1)+"/"+s.steps.length+"  "+x(q.q)));
    var opts=el("div","opts"),fb=el("div","fb");fb.hidden=true;fb.setAttribute("aria-live","polite");
    shuf(q.o.length).forEach(function(oi){
      var o=q.o[oi],b=el("button","opt",x(o[0]));b.type="button";
      b.addEventListener("click",function(){
        fb.hidden=false;fb.textContent="";
        if(o[1]){
          $$(".opt",opts).forEach(function(p){p.disabled=true});b.classList.add("right");
          fb.className="fb good";fb.appendChild(el("b","",u("right")));fb.appendChild(el("span","",x(o[2])));
          var nx=el("button","btn",step+1<s.steps.length?u("next"):u("finish"));nx.type="button";nx.style.marginTop="10px";
          nx.addEventListener("click",function(){step++;render()});fb.appendChild(el("div")).appendChild(nx);
        }else{
          b.classList.add("wrong");b.disabled=true;
          fb.className="fb bad";fb.appendChild(el("b","",u("notbest")));fb.appendChild(el("span","",x(o[2])));
        }
      });
      opts.appendChild(b);
    });
    body.appendChild(opts);body.appendChild(fb);

function explorer(){
  var w=el("div"),tools=el("div","tools");
  function fld(label,ctl){var d=el("div"),l=el("label","",label);l.appendChild(document.createElement("span"));d.appendChild(l);d.appendChild(ctl);tools.appendChild(d);return ctl}
  var inp=el("input");inp.type="search";inp.placeholder=u("searchPh");inp.setAttribute("aria-label",u("search"));
  var sel=el("select"),sel2=el("select");
  [["",u("both")],["I",u("table")+" I"],["II",u("table")+" II"]].forEach(function(o){var op=el("option","",o[1]);op.value=o[0];sel.appendChild(op)});
  var o0=el("option","",u("anyDrug"));o0.value="";sel2.appendChild(o0);
  Object.keys(LINKNAMES).forEach(function(k){var op=el("option","",x(LINKNAMES[k]));op.value=k;sel2.appendChild(op)});
  fld(u("search"),inp);fld(u("table"),sel);fld(u("linked"),sel2);
  var cnt=el("div","count");cnt.setAttribute("aria-live","polite");var list=el("div","chems");
  w.appendChild(tools);w.appendChild(cnt);w.appendChild(list);
  function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}
  function draw(){
    var q=norm(inp.value.trim()),t=sel.value,d=sel2.value,n=0;
    list.textContent="";
    CHEMS.forEach(function(c){
      if(t&&c[2]!==t)return;
      var keys=c[5].split(/,\s*/);
      if(d&&keys.indexOf(d)<0)return;
      var name=c[LI];
      if(q&&norm(c[0]+" "+c[1]+" "+c[3]+" "+c[4]).indexOf(q)<0)return;
      n++;
      var card=el("div","chem"),top=el("div","top");
      top.appendChild(el("h4","",name));
      var pills=el("span");pills.appendChild(el("span","pill",u("table")+" "+c[2]));
      if(c[8]){var p2=el("span","pill d",u("designer"));p2.style.marginLeft="6px";pills.appendChild(p2)}
      top.appendChild(pills);card.appendChild(top);
      var r1=el("div","row ids");r1.appendChild(el("b","","CAS "));r1.appendChild(document.createTextNode(c[3]+"   "));r1.appendChild(el("b","",(LI?"ONU ":"UN ")));r1.appendChild(document.createTextNode(c[4]));card.appendChild(r1);
      var r2=el("div","row");r2.appendChild(el("b","",u("inDrug")+": "));r2.appendChild(document.createTextNode(keys.map(function(k){return LINKNAMES[k]?x(LINKNAMES[k]):k}).join(", ")));card.appendChild(r2);
      var r3=el("div","row");r3.appendChild(el("b","",u("legit")+": "));r3.appendChild(document.createTextNode(c[LI+6]));card.appendChild(r3);

function finalBlock(box){
  var order=shuf(FINAL.length),answered=0,correct=0,res=el("div","finres");res.setAttribute("aria-live","polite");
  var qs=el("div","quiz");
  order.forEach(function(qi,k){
    var it=FINAL[qi],fs=el("fieldset","q");fs.appendChild(el("legend","",(k+1)+". "+x(it.q)));
    var opts=el("div","opts"),fb=el("div","fb");fb.hidden=true;var btns=[];
    shuf(it.o.length).forEach(function(oi){
      var b=el("button","opt",x(it.o[oi]));b.type="button";btns.push([b,oi]);
      b.addEventListener("click",function(){
        var ok=oi===it.a;btns.forEach(function(p){p[0].disabled=true;if(p[1]===it.a)p[0].classList.add("right")});
        if(!ok)b.classList.add("wrong");
        fb.hidden=false;fb.className="fb "+(ok?"good":"bad");fb.textContent="";
        fb.appendChild(el("b","",ok?u("right"):u("notq")));fb.appendChild(el("span","",x(it.w)));
        answered++;if(ok)correct++;
        if(answered===FINAL.length)finish();

      opts.appendChild(b);
    });
    fs.appendChild(opts);fs.appendChild(fb);qs.appendChild(fs);
  });
  box.appendChild(qs);box.appendChild(res);
  function finish(){
    var pass=correct>=PASS;
    st.attempts++;st.lastScore=correct;if(st.best==null||correct>st.best)st.best=correct;
    if(pass){if(!st.completedAt)st.completedAt=new Date().toISOString();if(st.done.indexOf("l11")<0)st.done.push("l11")}
    save();updateProgress();
    if(CFG.formUrl)postForm().then(function(){setRec("ok")},function(){setRec("fail")});
    res.textContent="";
    var s=el("p","score",u("answered")+" "+(LI?(correct+" "+u("correctOf")+" "+TOTAL):(correct+" of "+TOTAL+" "+u("correctOf")))+"."+(pass?"":u("reviewTry")));
    res.appendChild(s);
    res.appendChild(el("span","pill"+(pass?" ok":""),pass?u("passed"):u("notPassed")));
    var note=el("p","sub recnote","");res.appendChild(note);if(!CFG.formUrl)setRec("local");

      var lg=$(".logo");if(lg){var im=el("img","clogo");im.src=lg.src;im.alt="";im.width=200;c.appendChild(im)}
      c.appendChild(el("small","",u("certOrg")));c.appendChild(el("h3","",u("certTitle")));
      c.appendChild(el("small","",u("certThat")));c.appendChild(el("div","nm",st.name||"…"));

      c.appendChild(el("small","",fmtDate(st.completedAt)));

    res.appendChild(rt);
  }
}

function init(){
  var hasClaude=window.claude&&typeof window.claude.use==="function";
  var loading=hasClaude?Promise.all([
    window.claude.use("db").then(function(d){db=d},function(){}),
    window.claude.use("user").then(function(n){userNs=n},function(){}),
    window.claude.use("downloads").then(function(d){dl=d},function(){})
  ]):Promise.resolve();
  var timeout=new Promise(function(r){setTimeout(r,6000)});
  Promise.race([loading,timeout]).then(function(){
    return userNs?userNs.id().then(function(i){return i},function(){return null}):null;
  }).then(function(id){
    uid=id;
    if(db&&uid){
      ref=db.doc("results/"+uid);

}
